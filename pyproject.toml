[project]
name = "enterprise-rag"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    # LangGraph
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.0",
    # LangChain
    "langchain-core>=1.0",
    "langchain-community>=0.4",
    # LlamaIndex
    "llama-index>=0.14",
    "llama-index-core>=0.14",
    "llama-index-llms-openai>=0.6",
    "llama-index-embeddings-openai>=0.5",
    # Database
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    # Configuration / validation
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # OpenAI
    "openai>=1.0",
    # HTTP / async
    "httpx>=0.27",
    "aiohttp>=3.9",
    # Environment variables
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: tests that need real Postgres + Qdrant (deselect with '-m \"not integration\"')",
]
